
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jin Xin Wholesale Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#12181b;--mute:#5a676c;--line:#d5dcdb;--accent:#0e5a4a;--on:#fff;--gold:#b8892b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#172120;--ink:#eef3f2;--mute:#9bacaa;--line:#2a3837;--accent:#3fb596;--on:#08201a;--gold:#d8ab4e}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#172120;--ink:#eef3f2;--mute:#9bacaa;--line:#2a3837;--accent:#3fb596;--on:#08201a;--gold:#d8ab4e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.08;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:800 1.35rem "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.01em}
.logo{display:flex;align-items:center;gap:10px}
.wm{display:flex;flex-direction:column;line-height:1;font-size:1.4rem}
.wm small{font:500 .72rem "DM Sans",sans-serif;color:var(--mute);margin-top:4px;letter-spacing:.04em}
.btn{display:inline-block;background:var(--accent);color:var(--on);padding:13px 22px;border-radius:999px;font-weight:500;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.hero{padding:34px 0 56px}
.hero h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-.03em;max-width:13ch}
.hero p{max-width:46ch;color:var(--mute);font-size:1.15rem;margin:20px 0 28px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 22px 18px;margin-bottom:64px}
.list h2{font-size:1.5rem;padding:18px 0 4px}
.list .note{color:var(--mute);font-size:.95rem;margin:0 0 8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:300px}
th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--mute);font-size:.9rem}
.r{text-align:right}
td.r{font-weight:700}
td:first-child{font-weight:500}
